version: '3.8'

services:
  redis:
    image: redis:alpine
    network_mode: "host"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: 
      context: ..
      dockerfile: backend/Dockerfile
    network_mode: "host"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../backend:/app/backend
      - ../storage:/app/storage
    env_file: .env
    depends_on:
      - redis

  worker:
    build: 
      context: ..
      dockerfile: backend/Dockerfile
    network_mode: "host"
    command: arq backend.workers.video_worker.WorkerSettings
    volumes:
      - ../backend:/app/backend
      - ../storage:/app/storage
    env_file: .env
    depends_on:
      - redis
